# PAGINA PRESENTACION  ******************************************************  El .
inicio00=Mantprev - Mantenimiento Total
inicio01=Gestión del Mantenimiento Industrial.
inicio02=El programa <b>MANTPREV - Mantenimiento Total</b> es el software más eficiente, accesible y fácil de usar para la gestión del mantenimiento industrial. Además, es una aplicación web multiplataforma, potente y sencilla, que puede ser utilizada en su computadora y también instalada en su dispositivo móvil Android. Su objetivo es proporcionar una herramienta de apoyo para la administración del mantenimiento de maquinaria en cualquier tipo de industria o institución donde las actividades de mantenimiento sean esenciales para el funcionamiento diario.
inicio03=<b>Mantprev - Mantenimiento Total</b> es una aplicación diseñada para gestionar el mantenimiento en cualquier tipo de industria o institución:
inicio04=QUÍMICA Y FARMACÉUTICA
inicio05=ALIMENTOS Y BEBIDAS
inicio06=EMPAQUE
inicio07=MINERÍA Y METALURGIA
inicio08=INDUSTRIA HOTELERA
inicio09=INDUSTRIA DEL PLASTICO
inicio10=INDUSTRIA TEXTIL
inicio11=HOSPITALES
inicio12=FLOTAS VEHICULARES
inicio13=MARITIMA-BUQUES
inicio14=CENTROS COMERCIALES
inicio15=PLANTAS CEMENTERAS

inicio41=Ventajas de gestionar el mantenimiento de los equipos de su empresa con <b>Mantprev - Mantenimiento Total</b>

inicio42=<b>Mantprev - Mantenimiento Total</b> es un sistema CMMS (Sistema de Gestión de Mantenimiento Computarizado) que asiste al personal técnico de diversas empresas industriales en la organización, planificación y ejecución de las tareas de mantenimiento de sus activos de forma más sistemática y profesional, lo que mejora la eficiencia operativa de los equipos en su conjunto, ayudando a disminuir los tiempos de inactividad y a extender la vida útil de los equipos. Algunas razones por lo que le convendría implementar <b>Mantprev - Mantenimiento Total</b> son las siguientes:
inicio43=ASISTENCIA GRATUITA PARA LA IMPLEMENTACIÓN
inicio44=El principal desafío en la implementación de un software de gestión de mantenimiento industrial radica en su etapa inicial. Este período exige un esfuerzo crítico para la configuración del sistema, lo cual incluye entre otros, la definición del árbol de activos, así como la recopilación e indexación de las rutinas de mantenimiento preventivo. El éxito a largo plazo depende directamente del entendimiento de estas y otras cargas de datos iniciales. Por nuestra parte nos comprometemos a acompañarle, completamente gratis, en este camino hasta que su implementación sea otro caso de éxito." 
inicio47=<br>Solicite la creación de una cuenta para su empresa dando clic en el siguiente enlace: <b><a href="https://mantprev.com/mantenimientoTotal/contacForm">Solicitud de creación de cuentas para empresas</a></b>. Le responderemos con rapidez.


inicio45=FÁCIL IMPLEMENTACIÓN
inicio46=La facilidad de implementación de <b>Mantprev - Mantenimiento Total</b> es fácilmente reconocida.

inicio51=PASOS PARA UNA IMPLEMENTACIÓN EXITOSA
inicio52=<b>Cargar al sistema el árbol de activos (máquinas/equipos) de la empresa:</b><br>La etapa inicial de la configuración implica el registro del Árbol de Equipos que recibirán mantenimiento. Para facilitar el proceso, este paso debe llevarse a cabo a través de la aplicación web en el menú correspondiente.
inicio53=<b>Registrar todos los usuarios del sistema:</b><br>El cargar los usuarios del sistema es un sencillo pero un esencial paso. Estos usuarios deben incluir a todas las personas que desempeñarán un rol dentro del sistema, ya sea como Administradores, Supervisores de Mantenimiento o solo como generadores de Órdenes de Trabajo, etc.
inicio54=<b>Realizar configuraciones particulares de la empresa (nombres de ejecutores, prioridades de OTs, etc.):</b><br>Para adaptar más plenamente la metodología de trabajo del sistema al sistema de trabajo propio de la de la empresa, se podrá personalizar algunos parámetros que harán que trabajo sea más cómodo y eficiente. 
inici54b=<b>Registrar Personal Técnico:</b><br>Cargar al sistema los nombres del personal que realiza directamente en la máquina el trabajo solicitado en las Orden de Trabajo o programado en las Rutinas de mantenimiento preventivo.
inicio55=<b>Ingresar nombres de fallas recurrentes:</b><br>Aunque el sistema incluye un listado de las fallas más comunes que se presentan en diferentes tipos de industrias, para lograr un control más preciso de las fallas específicas de su planta, es recomendable agregar un listado de las fallas que ocurren con mayor frecuencia en su entorno industrial.

inicio56=FÁCIL GESTIÓN DE ÓRDENES DE TRABAJO
inicio57=Dado que <b>Mantprev - Mantenimiento Total</b> es un sistema multiplataforma, resulta muy sencillo para los usuarios generar Órdenes de Trabajo desde su teléfono móvil \u2014ya sea dentro de la planta o desde cualquier otro punto\u2014 y dar seguimiento al ciclo de vida de cada OT, aprovechando todo el potencial que este documento ofrece. El ciclo de vida de una Orden de Trabajo se compone de cuatro etapas:
inicio58=<b>Creación de la Orden de Trabajo:</b><br>Una Orden de Trabajo puede crearse desde la aplicación móvil o desde la versión web. En ambos casos, es posible agregar fotografías, asignar una prioridad y designar un ejecutor, de acuerdo con el criterio del solicitante.
inicio59=<b>Revisión (Autorización) de las Órdenes de Trabajo:</b><br>En esta etapa, solo el personal de mantenimiento autorizado puede revisar el contenido de la OT y realizar modificaciones cuando lo considere necesario.
inicio60=<b>Ejecución física del trabajo solicitado:</b><br>Esta etapa del ciclo de vida de una OT es ejecutada por el personal técnico de mantenimiento encargado de realizar las tareas descritas en la Orden de Trabajo.
inicio61=<b>Reporte de ejecución del trabajo:</b><br>Reportar la ejecución del trabajo implica cerrar o dar por concluido el trabajo que fue solocitado en la OT. Esta etapa es importante, ya que permite registrar valiosa información del trabajo realizado que proporcionará con tiempo la información para análisis de desempeño del conjunto de las máquinas y del departamento de mantenimiento en si.
inicio62=EVALUACIÓN DEL DESEMPEÑO EN TIEMPO REAL
inicio63=Evaluar el desempeño del Departamento de Mantenimiento es fundamental para lograr una mejora continua. Por ello, después de ejecutar las Órdenes de Trabajo e ingresar al sistema los resultados de su ejecución, el siguiente paso consiste en analizar el desempeño del trabajo realizado. <b>Mantprev - Industrial Work Orders</b> proporciona una serie de gráficos y tablas estadísticas que ofrecen información valiosa sobre todas las actividades efectuadas en cada máquina, así como sobre el nivel de profesionalismo general del departamento de mantenimiento.


# IMPLEMENTACION *******************************************************************************
implement01=Implementación Mantprev - Manteninimiento Total
implement02=La implementación exitosa de <b>MANTPREV \u2013 Mantenimiento Total</b>, como la de cualquier aplicación diseñada para la gestión del mantenimiento industrial, inicia primeramente con las configuraciones iniciales del sistema. En <b>Mantprev - Mantenimiento Total</b>, la configuración es sencilla. A continuación se enumeran y se explican todas éstas opciones de configuración que al realizarlas, haran que la implementción se encamine al éxito.
implement03=CONFIGURACIÓN PARA UNA IMPLEMENTACION EXITOSA
implement04=<b>Cargar el Árbol de activos </b><br>La primera etapa de la configuración consiste en cargar al sistema el árbol las máquinas/equipos de la empresa.
implement05=<b>Cargar los usuarios del sistema:</b><br> Los usuarios seran todas aquellas personas que tendrán un rol dentro del sistema, ya sea como Administradores, Supervisores de Mantenimiento, emisores de Órdenes de Trabajo, etc.
implement06=<b>Realizar las configuraciones Generales:</b><br>Estas configuraciones consisten en definir los nombres de ejecutores, las prioridades de OTs, etc., de acuerdo con la estructura de trabajo específicas de su organización. 
implement07=<b>Cargar el personal técnico:</b><br>El personal técnico son todas aquellos empleados de mantenimiento que ejecutan los trabajos directamente en las máquinas o equipos.
implement08=<b>Cargar y programar las Rutinas de Mantenimiento Preventivo:</b><br> Cargar y programar todas las actividades de mantenimiento que recomiendan los fabricantes de las diferentes máquinas que están instaladas en la planta.

implement09=CARGAR EL ÁRBOL DE EQUIPOS DE SU EMPRESA AL SISTEMA
implement10=Inicialmente, el sistema incluye un <b>Árbol de Equipos</b> provisional, éste deberá ser modificado editando nombres y agregando los equipos propios de su empresa agrupándolos en Departamentos o Líneas de Producción, hasta crear un árbol de equipos que incluya todas las máquinas/equipos de su empresa. 
implement11=Al cargar el Árbol de Equipos desde la aplicación web, encontrará en la parte superior izquierda de la pantalla de trabajo lo que se conoce como el <b>Árbol de Equipos</b> provisional. A partir de este, se deben editar los nombres y agregar todos los equipos que forman parte de los procesos de producción de su empresa. Cada uno de los ítems ingresados (incluidos los Departamentos o Líneas de Producción) se consideran Máquinas o Equipos y pueden \u2014y deben\u2014 tener subequipos (llamados equipos hijos), agrupándolos todos según el flujo del proceso productivo.
implement12=1) Identifique los puntos de expansión.

implement13=2) Dé un clic sobre cada punto de expansión para desplegar los equipos que pertecen a cada Departamentos de Producción.
implement14=3) Renombre cada uno de los Departamentos de Producción y los equipos que pertenecen a los mismos. Luego, ingrese todos los demás Departamentos y Equipos que forman parte de los activos de su organización.
implement15=Indicaciones para ingresar al sistema el Árbol de Equipos:
implement16=Con el mouse, dé un clic sobre cada uno de los puntos de expansión en el Árbol de Equipos (ver Fig.1 y Fig.2).
implement17=Cambie el nombre de cada uno de los Departamentos o Líneas de Producción según la estructura real de su empresa. Agregue todos los Departamentos o Líneas de Producción que sean necesarios. Para agregar un nuevo Departamento, coloque el cursor del mouse sobre el nodo de <b>Planta General</b> y haga clic derecho; se desplegará un menú contextual. Seleccione la opción <b>Add new Equipment</b>. Este proceso debe repetirse cada vez que desee agregar un nuevo Departamento a la <b>Planta General</b>.
implement18=Cambie el nombre de cada uno de los Equipos agrupados dentro de los Departamentos o Líneas de Producción agregados al Árbol de Equipos. Agregue los equipos necesarios a cada Departamento de acuerdo con la realidad operativa de su empresa. Para agregar un nuevo Equipo a un Departamento, coloque el cursor del mouse sobre el Departamento correspondiente y haga clic derecho; se desplegará un menú contextual. Seleccione la opción <b>Add new Equipment</b>. Este proceso debe repetirse cada vez que agregue un nuevo Equipo a cualquiera de los Departamentos.
implement19=Cuando haya ingresado todos los Departamentos o Líneas de Producción de su empresa junto con sus respectivos equipos, agregue un Departamento adicional con el nombre <b>SERVICIOS GENERALES</b>. Incluya en este Departamento todos los equipos que brindan servicio de forma general a toda la empresa (por ejemplo: Calderas, Compresores de aire, Sistemas eléctricos, etc.).
implement20=INGRESAR LOS USUARIOS DEL SISTEMA
implement21=Los usuarios son todas aquellas personas que tendrán un rol dentro del sistema (Administradores, Supervisores de Mantenimiento o Emisores de Órdenes de Trabajo). Al ingresar un nuevo usuario, el sistema enviará automáticamente un correo electrónico con una contraseña provisional y una explicación sobre cómo acceder al sistema por primera vez, así como los privilegios asignados dentro de la aplicación.
implement22=ROLES DE USUARIOS
implemen22b=Asigne un rol al usuario (de entre 4 posibles)

implement23=<b>Rol Administrador:</b><br>Un Administrador es un usuario principal. Puede haber varios en el sistema, y son los encargados de realizar las configuraciones generales, ingresar otros usuarios, generar y autorizar Órdenes de Trabajo (OTs) y todas las demás opciones disponibles en el sistema.
implement24=<b>Rol Supervisor de Mantenimiento:</b><br>Su principal responsabilidad será reportar en el sistema la ejecución de las Órdenes de Trabajo y verificar que las actividades de mantenimiento se realicen según lo planificado.
implement25=<b>Rol Emisor de Órdenes de Trabajo:</b><br>Este rol es asignado a jefes y supervisores de producción, así como cualquier empleado que pueda el acceso a las máquinas de la empresa.

implement26=CONFIGURACIONES GENERALES:
implement27=<b>Las Configuraciones generales</b> son un conjunto de ajustes en la terminología de nombres que permiten al sistema adaptarse a la metodología de trabajo específica de su empresa. Esto incluye modificar los nombres de los ejecutores según la terminología utilizada internamente, definir las prioridades de las Órdenes de Trabajo, los tipos de fallas más comunes, entre otros parámetros.
implement28=<b>Los Ejecutores de OTs y Ruts</b> son los grupos de personal técnico de mantenimiento con determinada especialidad, encargados de realizar las actividades definidas en las Rutinas de mantenimiento preventico como el las Órdenes de Trabajo.
implement29=<b>La Clasificación de las Órdenes de Trabajo</b> es el método utilizado para determinar la severidad de la falla en el equipo que originó la Orden de Trabajo. (NOTA: Las primeras tres opciones no son editables).
implement30=<b>La Prioridad de la Orden de Trabajo</b> indica el nivel de urgencia con el que los usuarios pueden solicitar la ejecución del trabajo definido en las Órdenes de Trabajo que generan.
implement31=<b>Los Tipos de Fallas</b> definen cómo se agrupan las fallas que se producen con mayor frecuencia en los equipos de la empresa.

implemen31b=INGRESAR PERSONAL TÉCNICO
implement32=Ingresar el <b>Personal Técnico</b> al sistema consiste en registrar la información de los empleados de mantenimiento (aquellos que ejecutan directamente las actividades solicitadas en las Rutinas y OTs). Esto es importante, entre otras razones, porque permite mantener un historial de los técnicos que ejecutan dichas actividades.
implement33=Ingresar la información del personal técnico de mantenimiento consiste básicamente en registrar dos datos: primero, el <b>Nombre y Apellido</b> del técnico, y segundo, el <b>Tipo de Ejecutor</b>. Como se explicó previamente, el Tipo de Ejecutor está relacionado con la especialidad del trabajo que realizan los empleados de mantenimiento (Mecánico, Eléctrico, Electromecánico, etc.), y las opciones disponibles deben haber sido configuradas previamente.

implement34=INGRESAR FALLAS RECURRENTES
implement35=Aunque la configuración inicial de <b>MANTPREV - Industrial Work Orders</b> incluye un listado de las fallas de máquinas más comunes en la industria, para que el sistema pueda llevar un control adecuado de las fallas más recurrentes en su empresa, es una buena práctica agregar al sistema un detalle de dichas fallas. Las fallas deben clasificarse por Tipos de Fallas (Mecánicas, Eléctricas, etc.), y esta clasificación debe haberse definido previamente.


# PAGINA CILCO DE VIDA DE LAS OTs
cVidaOt01=ORDENES DE TRABAJO
cVidaOt02=Formulario de Ordenes de Trabajo para Mantenimiento Total, versión Androi (imagen izquierda) y versión Web (imagen derecha).
cVidaOt03=La Orden de Trabajo es el documento que informa al personal de mantenimiento sobre las actividades a realizar en los equipos de la planta. Para aprovechar al máximo sus beneficios, es fundamental comprender su ciclo de vida, el cual consta de las siguientes cuatro etapas:
cVidaOt04=<b>Creación de la Orden de Trabajo:</b><br>La primera etapa del ciclo de vida de una Orden de Trabajo es su creación. Para crear una Orden de Trabajo en <b>Mantprev - Industrial Work Orders</b>, el usuario simplemente debe presionar la opción correspondiente del menú (ya sea en la versión web o en su equivalente móvil). Esto lo llevará al formulario de la Orden de Trabajo, donde deberá ingresar toda la información solicitada, incluyendo el equipo que requiere la intervención.
cVidaOt05=<b>Revisión (Autorización) de la OT por el personal técnico autorizado:</b><br>Debido a que, en muchos casos, una OT es generada por personal de producción que no siempre tiene claro el funcionamiento técnico de los equipos, la revisión o autorización de la OT por parte de un supervisor o jefe de mantenimiento es un paso necesario. Esta etapa consiste en revisar y, de ser necesario, editar el contenido de la OT para que se alinee técnicamente con la realidad del trabajo a realizar. 
cVidaOt06=<b>Ejecución física del trabajo:</b><br>Esta es la etapa más importante del ciclo de vida de una Orden de Trabajo, constituye el propósito fundamental del documento.
cVidaOt07=<b>Reporte de ejecución del trabajo:</b><br>El reporte de ejecución del trabajo es la última etapa del ciclo de vida de una OT. Consiste en ingresar al sistema valiosa la información proveniente de la ejecución del trabajo realizado. Este paso es fundamental para la futura generación de métricas y análisis de rendimiento.

cVidaOt08=CREACIÓN DE LA ORDEN DE TRABAJO
cVidaOt09=(Información necesaria para la creación de la Orden de Trabajo vista aqui según formato de la versión Android)
cVidaOt10=Generar una Orden de Trabajo es un proceso sencillo. En la versión móvil, se mostrará una pantalla como la que se observa en la foto izquierda. Ingrese la información solicitada y, posteriormente, presione el botón <b>Enviar OT</b>.
cVidaOt11=<b>Equipo:</b><br>Toque el botón para desplegar el Árbol de Equipos previamente ingresado. Busque la máquina o equipo al que desea solicitar el trabajo y, al encontrarlo, selecciónelo con un toque.
cVidaOt12=<b>Trabajo a solicitar:</b><br>Describa brevemente, pero de forma clara, el trabajo que se requiere realizar.
cVidaOt13=<b>Ejecutor del trabajo:</b><br>Seleccione un tipo de ejecutor. Un ejecutor representa una especialidad técnica del personal de mantenimiento encargado de realizar la tarea. Los tipos de ejecutores son configurables (Mecánicos, Electricistas, Lubricadores, etc.)
cVidaOt14=<b>Prioridad del trabajo:</b><br>Seleccione la prioridad con la que desea que se ejecute el trabajo solicitado. Las prioridades también pueden configurarse según las políticas de la empresa.
cVidaOt15=<b>Anexar fotos:</b><br>Anexe una o varias fotografías si estas ayudan a comprender mejor el trabajo solicitado.
cVidaOt16=Al presionar el botón <b>Enviar OT</b>, se enviará automáticamente un correo electrónico a todo el personal de mantenimiento, informando que un usuario ha generado una Orden de Trabajo e incluyendo en el mismo correo todos los detalles de la OT. (La opción de envío automático de correos al generar Órdenes de Trabajo puede configurarse en el menú correspondiente).

cVidaOt17=REVISIÓN (Autorización) DE ORDENES DE TRABAJO
cVidaOt18=(Este proceso es realizado por el personal de mantenimiento autorizado, quien revisa la Orden de Trabajo (OT) para verificar que su contenido o solicitud sea técnicamente correcta. Esta etapa solo puede ser ejecutada por un Administrador del Sistema o un Supervisor de Mantenimiento.)
cVidaOt19=<b>Trabajo solicitado y equipo o máquina correspondiente.</b><br>Durante el proceso de revisión o autorización de una OT, se puede modificar la descripción del trabajo solicitado si la persona que realiza la revisión lo considera necesario.
cVidaOt20=<b>Ejecutor y prioridad del trabajo seleccionados por el emisor de la OT:</b><br>En ambos casos, el personal técnico que realiza la revisión de la OT puede cambiar las selecciones previas si lo considera apropiado.
cVidaOt21=<b>Clasificación de la Orden de Trabajo:</b><br>Una OT puede clasificarse de distintas formas dependiendo de la gravedad del daño o problema en la máquina que obliga a generar una OT. La primera y más grave es clasificar la OT como una <b>Avería</b>. Para el sistema Mantprev, una máquina sufre una Avería cuando ésta deja de funcionar abruptamente, obligando al personal de mantenimiento a intervenir de inmediato. La segunda posible clasificación de una OT es <b>Preventivo de Avería</b>; en este caso, una OT debe clasificarse así cuando el trabajo solicitado tiene como objetivo evitar que la máquina deje de trabajar en forma abrupta. La tercera posible clasificación una OT es <b>Mantenimiento Normal</b>, que corresponde al trabajo solicitado en una OT que puede ser considerado como mantenimiento no crítico. 
cVidaOt22=<b>Estatus de la Orden de Trabajo:</b><br>Los posibles estatus de una OT son: <b>Nueva OT</b> (cuando se crea una Orden de Trabajo), <b>Revisada</b> (después de haber sido revisada por el personal técnico de mantenimiento), <b>En proceso</b> (cuando ha sido revisada y ya se iniciaron los trabajos correspondientes solicitados en la OT) y <b>Rechazada</b> (cuando el personal técnico considera que la OT fue generada por error, duplica otra OT existente o el trabajo solicitado presenta una objeción técnica que impide su ejecución, entre otros motivos).
cVidaOt23=<b>Debe ingresarse la cantidad estimada de técnicos necesarios para realizar el trabajo.</b>
cVidaOt24=<b>Debe ingresarse la cantidad de tiempo estimada (en horas) para realizar el trabajo.</b>
cVidaOt25=<b>Preparativos previos a la ejecución del trabajo:</b><br>En este espacio, de ser necesario, se registran las indicaciones sobre los preparativos previos requeridos para ejecutar el trabajo. Esto puede incluir la cotización y compra de repuestos, coordinaciones con otros departamentos, entre otros.
cVidaOt26=<b>Explicación en caso de rechazo:</b><br>En caso de que la OT sea <b>Rechazada</b> por el personal técnico, en este se debe anotar las razones del rechazo.


cVidaOt27=EJECUCIÓN DEL TRABAJO SOLICITADO EN LA ORDEN DE TRABAJO
cVidaOt28=(El proceso es el que realiza en la planta, específicamente en la máquina o equipo asociado a la Orden de Trabajo.)

cVidaOt29=REPORTE DE EJECUCIÓN DEL TRABAJO REALIZADO
cVidaOt30=(Este proceso debe ser realizado, idealmente, por el supervisor de mantenimiento encargado de la ejecución de la Orden de Trabajo.)
cVidaOt31=<b>Fecha de ejecución:</b><br>Toque para seleccionar la fecha en que se efectuó el trabajo. Si las actividades duraron varios días, seleccione la fecha del último día de ejecución.
cVidaOt32=<b>Horas de paro de producción:</b><br>Escriba el tiempo total, en horas, durante el cual la ejecución de las actividades de la Orden de Trabajo afectó los procesos normales de producción de la máquina.
cVidaOt33=<b>Horas de trabajo:</b><br>Escriba el tiempo total, en horas, que los técnicos de mantenimiento dedicaron a la ejecución de la Orden de Trabajo.
cVidaOt34=<b>Calidad del trabajo:</b><br>Evalúe la calidad del trabajo realizado por los técnicos de mantenimiento.
cVidaOt35=<b>Reporte del trabajo realizado:</b><br>Describa, con el nivel de detalle que considere necesario, las actividades efectuadas durante la ejecución de la Orden de Trabajo.
cVidaOt36=<b>Nombre de la falla:</b><br>Cada Orden de Trabajo está asociada a una falla que motivó su generación. Toque la casilla correspondiente y se desplegará un listado de fallas organizadas por tipo. Si no encuentra la falla en el listado, vaya a la sección de configuraciones y agréguela en la opción correspondiente.
cVidaOt37=<b>Supervisor de la Orden de Trabajo:</b><br>Toque la casilla para desplegar los nombres de todos los supervisores y jefes de mantenimiento de la empresa. Seleccione el nombre del supervisor responsable de la ejecución del trabajo.
cVidaOt38=<b>Recibió el trabajo:</b><br>Escriba el nombre del encargado de producción del área o del responsable de la máquina que recibió el trabajo como concluido a plena satisfacción.
cVidaOt39=<b>Seleccionar técnicos:</b><br>Toque para seleccionar los técnicos de mantenimiento que participaron en el trabajo. Después de seleccionar el primer técnico, escriba la cantidad de horas que este empleó en la ejecución. Luego, toque la palabra <b>Agregar</b> para registrar la información en la tabla inferior. Repita este proceso con cada uno de los técnicos que intervinieron en la ejecución del trabajo.
cVidaOt40=<b>Repuestos utilizados:</b><br>Si durante la ejecución del trabajo se utilizaron repuestos, toque esta opción para desplegar un formato que permita agregar, en una tabla, los repuestos empleados.
cVidaOt41=<b>Servicios externos:</b><br>Si en la ejecución del trabajo se utilizaron servicios externos, toque esta opción para desplegar un formato que permita agregar, en una tabla, los servicios externos utilizados.
cVidaOt42=<b>Agregar fotos:</b><br>Si el trabajo realizado lo amerita y se desea documentarlo fotográficamente, se pueden agregar tantas imágenes como se considere necesario.
cVidaOt43=<b>Guardar el reporte de ejecución:</b><br>Al finalizar, no olvide guardar el reporte realizado.


# SOPORTE Y SERVICIOS
sopport01=El sistema <b>MANTPREV - Industrial Work Orders</b> es un software de gran alcance, intuitivo y de fácil implementación. A pesar de su sencilla instalación y configuración, para garantizar el éxito en todos los aspectos, <b>MANTPREV</b> ofrece diversos servicios que contribuirán a que el sistema se convierta en la herramienta clave para asegurar la eficiencia de la gestión de mantenimiento.
sopport02=SOPORTE Y SERVICIOS ADICIONALES
sopport03=Algunos servicios adicionales pueden resultar de gran beneficio para su empresa. Estos servicios son los siguientes:
sopport04=Personalización de <b>MANTPREV</b>:
sopport05=En caso de ser necesario, y con el objetivo de adaptar el sistema de forma más precisa a la metodología de trabajo de su empresa, ofrecemos servicios de personalización que incluyen la creación de nuevos reportes, la modificación de los existentes y cualquier otra adaptación que requiera cambios en el código fuente.
sopport06=Creación de Rutinas de Equipos:
sopport07=La tarea más compleja en la implementación de cualquier software para la administración del mantenimiento industrial es la creación y definición de las rutinas de los diferentes equipos de la planta. Para facilitar este proceso, <b>MANTPREV S.A.</b> ofrece el servicio de elaboración y programación de todas las rutinas correspondientes a los equipos de su empresa. Para llevar a cabo esta tarea, solo será necesario contar con las especificaciones de sus equipos; a partir de esta información, podremos generar todas las rutinas utilizando nuestra Biblioteca de Equipos, información disponible en Internet o la proporcionada directamente por el cliente, hasta lograr su completa satisfacción.
